/* ---- src/components/cart/CartItem.jsx ---- */
const CartItem = ({ item, onUpdateQuantity, onRemove }) => {
  const safeItem = item || {};
  const name = safeItem.name || "Unnamed Product";
  const price = typeof safeItem.price === "number" ? safeItem.price : 0;
  const quantity = typeof safeItem.quantity === "number" ? safeItem.quantity : 1;
  const image = safeItem.image || "";
  const selectedSize = safeItem.selectedSize !== undefined ? safeItem.selectedSize : null;
  const selectedColor = safeItem.selectedColor !== undefined ? safeItem.selectedColor : null;
  const itemId = safeItem.id || "";

  const handleQuantityChange = (newQuantity) => {
    if (onUpdateQuantity) {
      onUpdateQuantity(itemId, newQuantity);
    }
  };

  const handleRemove = () => {
    if (onRemove) {
      onRemove(itemId);
    }
  };

  const itemTotal = price * quantity;

  return (
    <Card padding="md" radius="md" shadow="sm">
      <Group align="flex-start" gap="lg">
        <Image
          src={image}
          alt={name}
          width={80}
          height={80}
          fit="cover"
          radius="md"
          fallbackSrc="https://placehold.co/80x80?text=Product"
        />
        <div style={{ flex: 1 }}>
          <Group justify="space-between" align="flex-start">
            <div>
              <Text fw={600} size="sm" mb={4}>
                {name}
              </Text>
              {selectedSize && (
                <Text size="xs" c="dimmed">
                  Size: {selectedSize}
                </Text>
              )}
              {selectedColor && (
                <Text size="xs" c="dimmed">
                  Color: {selectedColor}
                </Text>
              )}
            </div>
            <Text fw={600} size="sm">
              {formatPrice(itemTotal)}
            </Text>
          </Group>
          <Group justify="space-between" mt="md">
            <QuantityControl
              quantity={quantity}
              min={1}
              max={10}
              onChange={handleQuantityChange}
            />
            <ActionIcon
              variant="subtle"
              color="red"
              size="sm"
              radius="sm"
              aria-label="Remove item"
              onClick={handleRemove}
            >
              <IconTrash size={rem(16)} />
            </ActionIcon>
          </Group>
        </div>
      </Group>
    </Card>
  );
};

/* ---- src/components/cart/CartSummary.jsx ---- */
const CartSummary = ({ cartTotal = 0, onCheckout }) => {
  const safeCartTotal = typeof cartTotal === "number" ? cartTotal : 0;
  
  const shippingThreshold = 150;
  const shippingCost = safeCartTotal >= shippingThreshold ? 0 : 15;
  const taxRate = 0.08;
  const tax = safeCartTotal * taxRate;
  const orderTotal = safeCartTotal + shippingCost + tax;

  return (
    <Paper padding="lg" radius="md" shadow="sm">
      <Stack gap="md">
        <Text size="lg" fw={600}>
          Order Summary
        </Text>

        <Group justify="space-between">
          <Text c="dimmed">Subtotal</Text>
          <Text fw={500}>{formatPrice(safeCartTotal)}</Text>
        </Group>

        <Group justify="space-between">
          <Text c="dimmed">Shipping</Text>
          <Text fw={500}>
            {shippingCost === 0 ? "Free" : formatPrice(shippingCost)}
          </Text>
        </Group>

        <Group justify="space-between">
          <Text c="dimmed">Estimated Tax</Text>
          <Text fw={500}>{formatPrice(tax)}</Text>
        </Group>

        <Divider />

        <Group justify="space-between">
          <Text size="lg" fw={700}>
            Total
          </Text>
          <Text size="lg" fw={700} c="gold">
            {formatPrice(orderTotal)}
          </Text>
        </Group>

        {safeCartTotal < shippingThreshold && (
          <Text size="xs" c="dimmed" ta="center">
            Add {formatPrice(shippingThreshold - safeCartTotal)} more for free shipping
          </Text>
        )}

        <Button
          size="md"
          radius="md"
          onClick={onCheckout}
          disabled={safeCartTotal === 0}
          style={{ width: "100%" }}
        >
          Proceed to Checkout
        </Button>
      </Stack>
    </Paper>
  );
};

  const getIcon = () => {
    switch (type) {
      case "cart":

      case "products":

        return <IconSearch size={rem(64)} stroke={1.5} />;

  return (
    <Center py={64}>
      <Stack align="center" gap="lg">
        {getIcon()}
        <Stack align="center" gap="xs">
          <Text size="xl" fw={600} c="dark">

            <Text size="sm" c="dimmed" maw={400} ta="center">
              {safeDescription}
            </Text>
          )}
        </Stack>
        {safeActionLabel && onAction && (
          <Button variant="outline" onClick={onAction}>
            {safeActionLabel}
          </Button>
        )}
      </Stack>
    </Center>
  );
};

/* ---- src/components/common/ProductCard.jsx ---- */
const ProductCard = ({ product, onQuickView, onAddToCart }) => {
  const [hovered, { hover }] = useDisclosure(false);
  
  const safeProduct = product || {};
  const name = safeProduct.name || "Unnamed Product";
  const price = typeof safeProduct.price === "number" ? safeProduct.price : 0;
  const salePrice = typeof safeProduct.salePrice === "number" ? safeProduct.salePrice : null;
  const rating = typeof safeProduct.rating === "number" ? safeProduct.rating : 0;
  const reviewCount = typeof safeProduct.reviewCount === "number" ? safeProduct.reviewCount : 0;
  const category = safeProduct.category || "uncategorized";
  const image = safeProduct.images?.[0] || "";
  const inStock = safeProduct.inStock !== false;

  const displayPrice = salePrice || price;
  const hasDiscount = salePrice && salePrice < price;

  const handleAddToCart = () => {
    if (onAddToCart && inStock) {
      onAddToCart(safeProduct);
    }
  };

  const handleQuickView = () => {
    if (onQuickView) {
      onQuickView(safeProduct);
    }
  };

  return (
    <Card
      shadow="sm"
      padding="md"
      radius="md"
      style={{
        transition: "transform 150ms ease, box-shadow 150ms ease",
        transform: hovered ? "translateY(-4px)" : "none",
        ...(hovered && { boxShadow: "xl" })
      }}
      {...hover}
    >
      <Box pos="relative">
        <Image
          src={image}
          alt={name}
          height={200}
          fit="cover"
          radius="md"
          fallbackSrc="https://placehold.co/400x400?text=Product+Image"
        />
        {hasDiscount && (
          <Badge
            color="gold"
            variant="filled"
            pos="absolute"
            top={8}
            right={8}
            size="sm"
          >
            Sale
          </Badge>
        )}
        <Group pos="absolute" top={8} left={8} gap={4}>
          <ActionIcon
            variant="white"
            size="sm"
            radius="xl"
            aria-label="Add to wishlist"
            style={{ opacity: 0.9 }}
          >
            <IconHeart size={rem(16)} />
          </ActionIcon>
        </Group>
      </Box>

      <Group justify="space-between" mt="md" mb="xs">
        <Text fw={600} size="sm" lineClamp={1}>
          {name}
        </Text>
        <Badge variant="light" color="slate" size="xs">
          {category}
        </Badge>
      </Group>

      <Group gap="xs" mb="md">
        <RatingStars rating={rating} reviewCount={reviewCount} />
      </Group>

      <Group justify="space-between" align="center">
        <Group gap="xs">
          <Text fw={700} size="md">
            {formatPrice(displayPrice)}
          </Text>
          {hasDiscount && (
            <Text size="xs" c="dimmed" td="line-through">
              {formatPrice(price)}
            </Text>
          )}
        </Group>
        <Group gap={4}>
          <ActionIcon
            variant="subtle"
            size="sm"
            radius="xl"
            aria-label="Quick view"
            onClick={handleQuickView}
          >
            <IconEye size={rem(16)} />
          </ActionIcon>
          <ActionIcon
            variant="filled"
            size="sm"
            radius="xl"
            aria-label="Add to cart"
            onClick={handleAddToCart}
            disabled={!inStock}
          >
            <IconShoppingCart size={rem(16)} />
          </ActionIcon>
        </Group>
      </Group>
    </Card>
  );
};

/* ---- src/components/common/RatingStars.jsx ---- */
const RatingStars = ({ rating = 0, reviewCount = 0, size = 16 }) => {
  const safeRating = typeof rating === "number" ? rating : 0;
  const safeReviewCount = typeof reviewCount === "number" ? reviewCount : 0;
  
  const fullStars = Math.floor(safeRating);
  const hasHalfStar = safeRating % 1 >= 0.5;
  const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);

  return (
    <Group gap={4} align="center">
      <Group gap={2}>
        {[...Array(fullStars)].map((_, i) => (
          <IconStarFilled key={`full-${i}`} size={rem(size)} style={{ color: "#d4af37" }} />
        ))}
        {hasHalfStar && <IconStarHalf size={rem(size)} style={{ color: "#d4af37" }} />}
        {[...Array(emptyStars)].map((_, i) => (
          <IconStar key={`empty-${i}`} size={rem(size)} style={{ color: "#cbd5e1" }} />
        ))}
      </Group>
      {safeReviewCount > 0 && (
        <Text size="xs" c="dimmed">
          ({safeReviewCount})
        </Text>
      )}
    </Group>
  );
};

const colorMap = {
  black: "#1e293b",
  white: "#ffffff",
  brown: "#92400e",
  tan: "#d6d3d1",
  navy: "#1e3a8a",
  blue: "#3b82f6",
  gray: "#6b7280",
  red: "#dc2626",
  green: "#16a34a",
  taupe: "#78716c",
  yellow: "#eab308"
};

const ColorSelector = ({ colors = [], selectedColor, onSelectColor }) => {
  const safeColors = Array.isArray(colors) ? colors : [];
  const safeSelectedColor = selectedColor !== undefined ? selectedColor : null;

  const handleColorSelect = (color) => {
    if (onSelectColor) {
      onSelectColor(color);
    }
  };

  const getColorStyle = (color) => {
    const baseColor = colorMap[color.toLowerCase()] || "#64748b";
    return {
      backgroundColor: baseColor,
      border: color.toLowerCase() === "white" 
        ? "2px solid var(--mantine-color-slate-3)" 
        : "2px solid transparent",
      outline: safeSelectedColor === color ? "2px solid var(--mantine-color-gold-6)" : "none",
      outlineOffset: safeSelectedColor === color ? "2px" : "0"
    };
  };

  return (
    <div>
      <Text size="sm" fw={500} mb="xs">
        Select Color
      </Text>
      <Group gap="xs" wrap="wrap">
        {safeColors.map((color, index) => (
          <UnstyledButton
            key={index}
            onClick={() => handleColorSelect(color)}
            aria-label={`Select ${color} color`}
            style={{
              width: rem(32),
              height: rem(32),
              borderRadius: "50%",
              ...getColorStyle(color),
              transition: "all 150ms ease",
              transform: safeSelectedColor === color ? "scale(1.1)" : "scale(1)"
            }}
          />
        ))}
      </Group>
    </div>
  );
};

/* ---- src/components/product/QuantityControl.jsx ---- */
const QuantityControl = ({ quantity = 1, min = 1, max = 10, onChange }) => {
  const safeQuantity = typeof quantity === "number" ? quantity : 1;
  const safeMin = typeof min === "number" ? min : 1;
  const safeMax = typeof max === "number" ? max : 10;

  const handleDecrement = () => {
    if (safeQuantity > safeMin && onChange) {
      onChange(safeQuantity - 1);
    }
  };

  const handleIncrement = () => {
    if (safeQuantity < safeMax && onChange) {
      onChange(safeQuantity + 1);
    }
  };

  return (
    <Group gap={4} align="center">
      <ActionIcon
        variant="outline"
        size="sm"
        radius="sm"
        aria-label="Decrease quantity"
        onClick={handleDecrement}
        disabled={safeQuantity <= safeMin}
      >
        <IconMinus size={rem(16)} />
      </ActionIcon>
      <Text size="sm" fw={500} w={32} ta="center">
        {safeQuantity}
      </Text>
      <ActionIcon
        variant="outline"
        size="sm"
        radius="sm"
        aria-label="Increase quantity"
        onClick={handleIncrement}
        disabled={safeQuantity >= safeMax}
      >
        <IconPlus size={rem(16)} />
      </ActionIcon>
    </Group>
  );
};

  const [loading, setLoading] = useState(true);
  const [filteredProducts, setFilteredProducts] = useState([]);

  const products = Array.isArray(mockProducts) ? mockProducts : [];

  useEffect(() => {
    setLoading(true);
    const timer = setTimeout(() => {
      let result = [...products];

      // Search filter
      if (searchQuery && typeof searchQuery === "string") {
        const query = searchQuery.toLowerCase();
        result = result.filter((product) => {
          const name = product?.name || "";
          const description = product?.description || "";
          return name.toLowerCase().includes(query) || description.toLowerCase().includes(query);
        });
      }

      // Category filter
      if (selectedCategory && selectedCategory !== "all") {
        result = result.filter((product) => product?.category === selectedCategory);
      }

      // Price range filter
      if (Array.isArray(priceRange) && priceRange.length === 2) {
        const minPrice = priceRange[0] || 0;
        const maxPrice = priceRange[1] || 300;
        result = result.filter((product) => {
          const productPrice = product?.salePrice || product?.price || 0;
          return productPrice >= minPrice && productPrice <= maxPrice;
        });
      }

      // Sort
      if (sortBy && typeof sortBy === "string") {
        switch (sortBy) {
          case "price-low":
            result.sort((a, b) => (a?.salePrice || a?.price || 0) - (b?.salePrice || b?.price || 0));
            break;
          case "price-high":
            result.sort((a, b) => (b?.salePrice || b?.price || 0) - (a?.salePrice || a?.price || 0));
            break;
          case "newest":
            result.sort((a, b) => (b?.id || 0) - (a?.id || 0));
            break;
          case "popular":
            result.sort((a, b) => (b?.reviewCount || 0) - (a?.reviewCount || 0));
            break;
          case "featured":
          default:
            // Keep original order
            break;
        }
      }

      setFilteredProducts(result);
      setLoading(false);
    }, 300);

    return () => clearTimeout(timer);
  }, [searchQuery, selectedCategory, priceRange, sortBy, products]);

  const handleQuickView = (product) => {
    if (onQuickView) {
      onQuickView(product);
    }
  };

  const handleAddToCart = (product) => {
    if (onAddToCart) {
      onAddToCart(product);
    }
  };

  const handleClearFilters = () => {
    window.dispatchEvent(new CustomEvent("clearFilters"));
  };

  if (loading) {
    return <LoadingSkeleton count={8} height={320} />;
  }

  if (filteredProducts.length === 0) {
    return (
      <EmptyState
        type="search"
        title="No products found"
        description="Try adjusting your search or filter criteria to find what you're looking for."
        actionLabel="Clear Filters"
        onAction={handleClearFilters}
      />
    );
  }

  return (
    <div id="products">
      <Group justify="space-between" mb="lg" px="lg">
        <Text size="sm" c="dimmed">
          Showing {filteredProducts.length} {filteredProducts.length === 1 ? "product" : "products"}
        </Text>
      </Group>
      <SimpleGrid cols={{ base: 1, xs: 2, sm: 2, lg: 4 }} spacing="lg" px="lg" pb="xl">
        {filteredProducts.map((product) => (
          <ProductCard
            key={product?.id}
            product={product}
            onQuickView={handleQuickView}
            onAddToCart={handleAddToCart}
          />
        ))}
      </SimpleGrid>
    </div>
  );
};

/* ---- src/context/CartContext.jsx ---- */
const CartContext = createContext(null);

const useCart = () => {
  const context = useContext(CartContext);
  if (!context) {
    throw new Error("useCart must be used within CartProvider");
  }
  return context;
};

const CartProvider = ({ children }) => {
  const [cartItems, setCartItems] = useState([]);

  useEffect(() => {
    try {
      const stored = localStorage.getItem("stride-cart");
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          setCartItems(parsed);
        }
      }
    } catch (error) {
      console.error("Failed to load cart from localStorage:", error);
    }
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem("stride-cart", JSON.stringify(cartItems));
    } catch (error) {
      console.error("Failed to save cart to localStorage:", error);
    }
  }, [cartItems]);

  const addItem = (product, quantity = 1, selectedSize, selectedColor) => {
    setCartItems((prev) => {
      const safePrev = Array.isArray(prev) ? prev : [];
      const existingIndex = safePrev.findIndex(
        (item) =>
          item.productId === product.id &&
          item.selectedSize === selectedSize &&
          item.selectedColor === selectedColor
      );

      if (existingIndex >= 0) {
        const updated = [...safePrev];
        updated[existingIndex] = {
          ...updated[existingIndex],
          quantity: updated[existingIndex].quantity + quantity
        };
        return updated;
      }

      return [
        ...safePrev,
        {
          id: `${product.id}-${Date.now()}`,
          productId: product.id,
          name: product.name,
          price: product.salePrice || product.price,
          image: product.images?.[0] || "",
          quantity,
          selectedSize,
          selectedColor
        }
      ];
    });
  };

  const removeItem = (itemId) => {
    setCartItems((prev) => {
      const safePrev = Array.isArray(prev) ? prev : [];
      return safePrev.filter((item) => item.id !== itemId);
    });
  };

  const updateQuantity = (itemId, quantity) => {
    setCartItems((prev) => {
      const safePrev = Array.isArray(prev) ? prev : [];
      if (quantity <= 0) {
        return safePrev.filter((item) => item.id !== itemId);
      }
      return safePrev.map((item) =>
        item.id === itemId ? { ...item, quantity } : item
      );
    });
  };

  const clearCart = () => {
    setCartItems([]);
  };

  const getCartTotal = () => {
    const safeItems = Array.isArray(cartItems) ? cartItems : [];
    return safeItems.reduce(
      (total, item) => total + (item.price || 0) * (item.quantity || 1),
      0
    );
  };

  const getCartCount = () => {
    const safeItems = Array.isArray(cartItems) ? cartItems : [];
    return safeItems.reduce(
      (count, item) => count + (item.quantity || 1),
      0
    );
  };

  const value = {
    cartItems,
    addItem,
    removeItem,
    updateQuantity,
    clearCart,
    getCartTotal,
    getCartCount
  };

  return <CartContext.Provider value={value}>{children}</CartContext.Provider>;
};

/* ---- src/lib/formatPrice.js ---- */
const formatPrice = (price) => {
  const safePrice = typeof price === "number" ? price : 0;
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(safePrice);
};

/* ---- src/lib/localStorage.js ---- */
const getLocalStorage = (key, defaultValue = null) => {
  try {
    const item = localStorage.getItem(key);
    if (item === null) {
      return defaultValue;
    }
    return JSON.parse(item);
  } catch (error) {
    console.error(`Failed to get localStorage key "${key}":`, error);
    return defaultValue;
  }
};

const setLocalStorage = (key, value) => {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (error) {
    console.error(`Failed to set localStorage key "${key}":`, error);
    return false;
  }
};

const removeLocalStorage = (key) => {
  try {
    localStorage.removeItem(key);
    return true;
  } catch (error) {
    console.error(`Failed to remove localStorage key "${key}":`, error);
    return false;
  }
};


export default { getLocalStorage, setLocalStorage, removeLocalStorage };

/* ---- src/pages/ProductDetail.jsx ---- */
const ProductDetail = ({ productId }) => {
  const [product, setProduct] = useState(null);
  const [loading, setLoading] = useState(true);
  const [selectedSize, setSelectedSize] = useState(null);
  const [selectedColor, setSelectedColor] = useState(null);
  const [quantity, setQuantity] = useState(1);
  const { addItem } = useCart();

  const products = Array.isArray(mockProducts) ? mockProducts : [];

  useEffect(() => {
    setLoading(true);
    const foundProduct = products.find((p) => p?.id === productId);
    setProduct(foundProduct || null);
    setLoading(false);
  }, [productId, products]);

  const handleSizeSelect = (size) => {
    setSelectedSize(size);
  };

  const handleColorSelect = (color) => {
    setSelectedColor(color);
  };

  const handleQuantityChange = (newQuantity) => {
    setQuantity(newQuantity);
  };

  const handleAddToCart = () => {
    if (product && selectedSize) {
      addItem(product, quantity, selectedSize, selectedColor);
    }
  };

  if (loading) {
    return (
      <Center py={80}>
        <Loader size="lg" />
      </Center>
    );
  }

  if (!product) {
    return (
      <Container size="lg" py={80}>
        <Center>
          <Text size="xl" c="dimmed">
            Product not found
          </Text>
        </Center>
      </Container>
    );
  }

  const images = Array.isArray(product?.images) ? product.images : [];
  const sizes = Array.isArray(product?.sizes) ? product.sizes : [];
  const colors = Array.isArray(product?.colors) ? product.colors : [];

  return (
    <Container size="lg" py={48}>
      <Grid gutter={{ base: "md", md: 48 }}>
        <Grid.Col span={{ base: 12, md: 6 }}>
          <ProductGallery
            images={images}
            productName={product?.name}
          />
        </Grid.Col>
        <Grid.Col span={{ base: 12, md: 6 }}>
          <ProductInfo
            product={product}
            selectedSize={selectedSize}
            selectedColor={selectedColor}
            quantity={quantity}
            onSizeSelect={handleSizeSelect}
            onColorSelect={handleColorSelect}
            onQuantityChange={handleQuantityChange}
            onAddToCart={handleAddToCart}
          />
        </Grid.Col>
      </Grid>
    </Container>
  );
};

/* ---- src/pages/Products.jsx ---- */
const Products = () => {
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedCategory, setSelectedCategory] = useState("all");
  const [priceRange, setPriceRange] = useState([0, 300]);
  const [sortBy, setSortBy] = useState("featured");

  useEffect(() => {
    const handleFilterCategory = (event) => {
      const category = event.detail;
      if (category) {
        setSelectedCategory(category);
      }
    };

    const handleClearFilters = () => {
      setSearchQuery("");
      setSelectedCategory("all");
      setPriceRange([0, 300]);
      setSortBy("featured");
    };

    window.addEventListener("filterCategory", handleFilterCategory);
    window.addEventListener("clearFilters", handleClearFilters);

    return () => {
      window.removeEventListener("filterCategory", handleFilterCategory);
      window.removeEventListener("clearFilters", handleClearFilters);
    };
  }, []);

  return (
    <Container size="lg" py={48}>
      <div style={{ textAlign: "center", marginBottom: rem(32) }}>
        <Title order={2} size="2.5rem" fw={700} c="dark" mb="xs">
          Our Collection
        </Title>
        <Text size="lg" c="dimmed" maw={600} mx="auto">
          Discover premium footwear designed for every stride in your journey
        </Text>
      </div>
      
      <ProductFilters
        onSearch={setSearchQuery}
        onCategoryChange={setSelectedCategory}
        onPriceChange={setPriceRange}
        onSortChange={setSortBy}
      />
      
      <ProductGrid
        searchQuery={searchQuery}
        selectedCategory={selectedCategory}
        priceRange={priceRange}
        sortBy={sortBy}
      />
    </Container>
  );
};

/* ---- src/App.jsx ---- */
const App = () => {
  const [currentPage, setCurrentPage] = useState("home");
  const [productId, setProductId] = useState(null);

  useEffect(() => {
    const handleHashChange = () => {
      const hash = window.location.hash.slice(1) || "home";
      const [page, id] = hash.split("/");
      setCurrentPage(page);
      setProductId(id || null);
    };

    window.addEventListener("hashchange", handleHashChange);
    handleHashChange();

    return () => {
      window.removeEventListener("hashchange", handleHashChange);
    };
  }, []);

  const renderPage = () => {
    switch (currentPage) {
      case "home":
        return <Home />;
      case "products":
        return <Products />;
      case "product":
        return productId ? <ProductDetail productId={productId} /> : <Products />;
      case "cart":
        return <Cart />;
      case "checkout":
        return <Checkout />;
      default:
        return <Home />;
    }
  };

  return (
    <CartProvider>
      <Box mih="100vh" style={{ display: "flex", flexDirection: "column" }}>
        <Navbar />
        <Box component="main" style={{ flexGrow: 1 }}>
          <Container size="xl" px={0}>
            {renderPage()}
          </Container>
        </Box>
        <Footer />
      </Box>
    </CartProvider>
  );
};
